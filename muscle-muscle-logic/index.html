<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>머슬머슬 로직</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gothic+A1:wght@400;700;900&display=swap">

<style>
  :root{
    --bg:#1c1410;
    --panel:#2a1d16;
    --panel-line:rgba(255,122,61,.25);
    --cream:#fff3e0;
    --muscle:#ff7a3d;
    --success:#4ade5f;
    --danger:#ff4d5e;
    --combo:#ffd23c;
    --muted:#a8927e;
    --hud:"Press Start 2P", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --kr:"Gothic A1", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  }
  *{ box-sizing:border-box; }

  body{
    margin:0; min-height:100dvh;
    background:radial-gradient(120% 80% at 50% 0%, #3a2415 0%, #1c1410 55%, #120c09 100%);
    color:var(--cream); font-family:var(--kr);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden; -webkit-tap-highlight-color:transparent;
  }

  .app{
    position:relative;
    width:min(100vw, 720px);
    height:min(100dvh, 1000px);
    background:var(--bg);
    overflow:hidden;
    box-shadow:0 0 0 1px var(--panel-line), 0 0 70px rgba(0,0,0,.7);
  }

  /* ============================ SCREENS ============================ */
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:24px; text-align:center;
  }
  .screen[hidden]{ display:none; }

  /* ---- TITLE ---- */
  .title-character{ font-size:clamp(40px,10vmin,64px); animation:titleBob 2.2s ease-in-out infinite; }
  @keyframes titleBob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
  .logo{
    font-family:var(--hud); font-size:clamp(20px,6vmin,34px); line-height:1.7;
    color:var(--muscle); text-shadow:0 0 18px rgba(255,122,61,.6);
  }
  .tagline{ color:var(--muted); font-size:clamp(12px,2.2vmin,15px); }

  .btn{
    font-family:var(--hud); font-size:clamp(12px,2.4vmin,16px);
    padding:14px 28px; background:var(--muscle); color:#1c1410; border:none;
    cursor:pointer; box-shadow:0 4px 0 #a8481f; letter-spacing:.06em;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 #a8481f; }
  .btn--ghost{
    background:transparent; color:var(--muted); border:1px solid var(--muted);
    box-shadow:none; padding:8px 16px; font-size:clamp(9px,1.8vmin,12px);
  }

  /* ---- CUTSCENE ---- */
  .screen--cutscene{ cursor:pointer; }
  .cutscene-figure{ font-size:clamp(48px,14vmin,96px); }
  .cutscene-text{ font-size:clamp(14px,2.6vmin,18px); min-height:2.6em; max-width:32em; }
  .btn--skip{ position:absolute; right:16px; bottom:16px; }

  /* ---- PLAYING ---- */
  .screen--playing{ justify-content:flex-start; padding:0; gap:0; }

  .hud{
    width:100%; display:flex; justify-content:space-around; align-items:center;
    padding:10px 6px; background:var(--panel);
    border-bottom:1px solid var(--panel-line);
    font-family:var(--hud);
  }
  .hud-stat{ position:relative; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .hud-label{ font-size:clamp(6px,1.3vmin,8px); color:var(--muted); letter-spacing:.12em; }
  .hud-value{ font-size:clamp(10px,2vmin,15px); color:var(--cream); font-variant-numeric:tabular-nums; }
  .hud-stat.muscle .hud-value{ color:var(--muscle); }
  .hud-stat.combo .hud-value{ color:var(--combo); }

  .hud-value.warning{ color:var(--combo); }
  .hud-value.critical{ color:var(--danger); animation:timeBlink 1s steps(1) infinite; }
  @keyframes timeBlink{ 50%{ opacity:.35; } }

  .hud-value.combo-pop{ animation:comboPop .3s ease; }
  @keyframes comboPop{ 0%{ transform:scale(1); } 50%{ transform:scale(1.4); } 100%{ transform:scale(1); } }

  .score-popup{
    position:absolute; left:50%; top:0; transform:translateX(-50%);
    font-family:var(--hud); font-size:clamp(9px,1.8vmin,12px);
    pointer-events:none; white-space:nowrap; animation:scorePopup .7s ease forwards;
  }
  .score-popup.positive{ color:var(--success); }
  .score-popup.negative{ color:var(--danger); }
  @keyframes scorePopup{
    0%{ opacity:1; transform:translate(-50%,0); }
    100%{ opacity:0; transform:translate(-50%,-16px); }
  }

  .board{
    flex:1; width:100%; display:grid;
    grid-template-columns:minmax(84px,auto) 1fr minmax(76px,auto);
    grid-template-areas:"character puzzle items";
    gap:10px; padding:12px; min-height:0;
  }
  .panel{ background:var(--panel); border:1px solid var(--panel-line); min-height:0; }
  .panel--character{ grid-area:character; display:flex; align-items:center; justify-content:center; }
  .panel--puzzle{ grid-area:puzzle; display:flex; align-items:center; justify-content:center; overflow:auto; }
  .panel--items{ grid-area:items; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }

  .character{ display:flex; flex-direction:column; align-items:center; gap:8px; }
  .character-stage{ position:relative; display:flex; align-items:center; justify-content:center; }
  .character-sprite{ font-size:clamp(34px,8vmin,54px); line-height:1; }
  .character-sprite.pop{ animation:pop .32s ease; }
  @keyframes pop{ 0%{ transform:scale(1); } 45%{ transform:scale(1.22); } 100%{ transform:scale(1); } }
  .character-sprite.pop.hype{ animation:popHype .22s ease; }
  @keyframes popHype{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.4); filter:drop-shadow(0 0 10px var(--combo)); }
    100%{ transform:scale(1); }
  }
  .character-sprite.game-over-fall{ animation:fallOver .6s ease forwards; }
  @keyframes fallOver{
    0%{ transform:rotate(0deg) scale(1); }
    30%{ transform:rotate(-8deg) scale(1.05); }
    60%{ transform:rotate(15deg) scale(.95); }
    100%{ transform:rotate(90deg) scale(.9); opacity:.85; }
  }
  .character-sprite.mistake-shake{ animation:mistakeShake .5s ease; }
  @keyframes mistakeShake{
    0%{ transform:translateX(0) scale(1); }
    20%{ transform:translateX(-6px) scale(1.05); }
    40%{ transform:translateX(6px); }
    60%{ transform:translateX(-4px); }
    80%{ transform:translateX(4px); }
    100%{ transform:translateX(0) scale(1); }
  }
  .dumbbell-drop{
    position:absolute; top:-14px; left:50%;
    font-size:clamp(14px,3.6vmin,20px); opacity:0; pointer-events:none;
  }
  .dumbbell-drop.falling{ animation:dumbbellFall .5s cubic-bezier(.4,0,1,1); }
  @keyframes dumbbellFall{
    0%{ opacity:1; transform:translate(-50%,-26px) rotate(0deg); }
    75%{ opacity:1; transform:translate(-50%,22px) rotate(55deg); }
    100%{ opacity:0; transform:translate(-50%,26px) rotate(45deg); }
  }
  .character-state{ font-family:var(--hud); font-size:clamp(6px,1.2vmin,8px); color:var(--muted); letter-spacing:.06em; }

  /* ---- NONOGRAM PUZZLE ---- */
  .puzzle-area{ display:flex; flex-direction:column; align-items:center; gap:8px; width:100%; }
  .mode-toggle{ display:flex; gap:6px; }
  .mode-btn{
    font-family:var(--kr); font-size:clamp(11px,2vmin,13px);
    padding:6px 14px; background:transparent; color:var(--muted);
    border:1px solid var(--muted); cursor:pointer;
  }
  .mode-btn.active{ background:var(--muscle); border-color:var(--muscle); color:var(--bg); font-weight:700; }

  .nonogram{
    display:grid; gap:2px; background:var(--panel-line); padding:2px;
    width:min(100%, 420px); aspect-ratio:1; margin:auto;
  }
  .ng-corner{ background:var(--bg); }
  .ng-colhint, .ng-rowhint{
    background:var(--bg); display:flex; color:var(--muted);
    font-family:var(--hud); font-size:clamp(6px,1.6vmin,10px);
    line-height:1.3; font-variant-numeric:tabular-nums;
  }
  .ng-colhint{ flex-direction:column; align-items:center; justify-content:flex-end; padding:2px 1px; }
  .ng-rowhint{ flex-direction:row; align-items:center; justify-content:flex-end; gap:3px; padding:0 4px; white-space:nowrap; }
  .ng-cell{
    background:var(--cream); display:flex; align-items:center; justify-content:center;
    font-size:clamp(7px,1.8vmin,11px); color:var(--danger); font-weight:700; user-select:none;
    cursor:pointer;
  }
  .ng-cell:hover{ filter:brightness(1.08); }
  .ng-cell.filled{ background:var(--muscle); }

  @keyframes ngFlashCorrect{
    0%{ transform:scale(1); }
    40%{ transform:scale(1.18); box-shadow:0 0 0 2px var(--success) inset; }
    100%{ transform:scale(1); }
  }
  @keyframes ngFlashWrong{
    0%, 100%{ transform:translateX(0); box-shadow:0 0 0 0 transparent inset; }
    20%{ transform:translateX(-4px); box-shadow:0 0 0 60px var(--danger) inset; }
    40%{ transform:translateX(4px);  box-shadow:0 0 0 60px var(--danger) inset; }
    60%{ transform:translateX(-3px); box-shadow:0 0 0 0 transparent inset; }
    80%{ transform:translateX(3px); }
  }
  .ng-cell.flash-correct{ animation:ngFlashCorrect .4s ease; position:relative; z-index:1; }
  .ng-cell.flash-wrong{ animation:ngFlashWrong .4s ease; position:relative; z-index:1; }

  .item-slot{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    background:transparent; border:1px solid transparent; border-radius:4px;
    padding:4px; font-family:inherit; cursor:pointer;
  }
  .item-slot:disabled{ opacity:.35; cursor:not-allowed; }
  .item-slot.selected{ border-color:var(--muscle); background:rgba(255,122,61,.15); }
  .item-icon{ font-size:clamp(20px,4vmin,26px); }
  .item-count{ font-family:var(--hud); font-size:clamp(9px,1.6vmin,12px); }

  .item-target-banner{
    font-size:clamp(10px,2vmin,13px); color:var(--muscle); text-align:center;
    cursor:pointer; text-decoration:underline; text-underline-offset:2px;
  }

  .ng-cell.revealed{ box-shadow:0 0 0 2px var(--combo) inset; }

  /* ---- CLEAR / GAME OVER ---- */
  .screen--clear h2, .screen--gameover h2{
    font-family:var(--hud); font-size:clamp(20px,5vmin,32px); margin:0;
  }
  .screen--clear h2{ color:var(--success); text-shadow:0 0 18px rgba(74,222,95,.6); }
  .screen--gameover h2{ color:var(--danger); text-shadow:0 0 18px rgba(255,77,94,.6); }
  .character-sprite.big{ font-size:clamp(56px,14vmin,92px); }
  .result-line{ font-family:var(--hud); font-size:clamp(11px,2.2vmin,15px); color:var(--cream); }
  .result-detail{ font-family:var(--hud); font-size:clamp(9px,1.7vmin,12px); color:var(--muted); margin:0; }
  .result-sub{ color:var(--muted); font-size:clamp(11px,2vmin,14px); }

  #clearSprite.muscle-lv-1{ transform:scale(.85); }
  #clearSprite.muscle-lv-2{ transform:scale(.95); }
  #clearSprite.muscle-lv-3{ transform:scale(1.05); }
  #clearSprite.muscle-lv-4{ transform:scale(1.2); filter:drop-shadow(0 0 8px var(--muscle)); }
  #clearSprite.muscle-lv-5{ transform:scale(1.35); filter:drop-shadow(0 0 14px var(--muscle)); }

  /* ---- responsive: stack panels on narrow screens ---- */
  @media (max-width:640px){
    .board{
      grid-template-columns:1fr;
      grid-template-areas:"character" "puzzle" "items";
      grid-auto-rows:min-content auto min-content;
    }
    .panel--character{ padding:8px; }
    .panel--items{ flex-direction:row; padding:8px; }
  }

  @media (prefers-reduced-motion: reduce){
    .character-sprite.pop, .character-sprite.pop.hype, .character-sprite.game-over-fall,
    .character-sprite.mistake-shake, .dumbbell-drop.falling{ animation:none; }
    .ng-cell.flash-correct, .ng-cell.flash-wrong{ animation:none; }
    .hud-value.critical{ animation:none; }
    .hud-value.combo-pop{ animation:none; }
    .score-popup{ animation:scorePopupReduced .7s ease forwards; }
    .title-character{ animation:none; }
  }
  @keyframes scorePopupReduced{ 0%{ opacity:1; } 100%{ opacity:0; } }
</style>
</head>
<body>

<div class="app" id="app">

  <!-- ============================ TITLE ============================ -->
  <section class="screen screen--title" id="screenTitle">
    <div class="title-character" id="titleCharacter">🧍</div>
    <div class="logo">머슬머슬<br>로직</div>
    <p class="tagline">풀수록 커지는 근육 퍼즐</p>
    <button class="btn" id="btnStart" type="button">START</button>
  </section>

  <!-- ============================ CUTSCENE ============================ -->
  <section class="screen screen--cutscene" id="screenCutscene" hidden>
    <div class="cutscene-figure" id="cutsceneFigure">🧍</div>
    <p class="cutscene-text" id="cutsceneText"></p>
    <button class="btn btn--ghost btn--skip" id="btnSkipCutscene" type="button">SKIP ▶</button>
  </section>

  <!-- ============================ PLAYING ============================ -->
  <section class="screen screen--playing" id="screenPlaying" hidden>
    <header class="hud">
      <div class="hud-stat muscle">
        <span class="hud-label">근육</span>
        <span class="hud-value" id="statMuscleLevel">LV.1</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">시간</span>
        <span class="hud-value" id="statTime">02:00</span>
      </div>
      <div class="hud-stat combo">
        <span class="hud-label">콤보</span>
        <span class="hud-value" id="statCombo">0</span>
      </div>
      <div class="hud-stat">
        <span class="hud-label">점수</span>
        <span class="hud-value" id="statScore">0</span>
      </div>
    </header>

    <div class="board">
      <aside class="panel panel--character" id="panelCharacter">
        <div class="character">
          <div class="character-stage">
            <div class="character-sprite" id="characterSprite">🧍</div>
            <div class="dumbbell-drop" id="dumbbellDrop">🏋️</div>
          </div>
          <div class="character-state" id="characterState">IDLE</div>
        </div>
      </aside>

      <div class="panel panel--puzzle" id="panelPuzzle">
        <div class="puzzle-area">
          <div class="item-target-banner" id="itemTargetBanner" hidden></div>
          <div class="mode-toggle" id="modeToggle">
            <button class="mode-btn active" id="btnModeFill" type="button">채우기</button>
            <button class="mode-btn" id="btnModeMark" type="button">X 표시</button>
          </div>
          <div class="nonogram" id="nonogramGrid"></div>
        </div>
      </div>

      <aside class="panel panel--items" id="panelItems">
        <button class="item-slot" id="btnItemDumbbell" type="button">
          <span class="item-icon">🏋️</span>
          <span class="item-count" id="itemCountDumbbell">0</span>
        </button>
        <button class="item-slot" id="btnItemProtein" type="button">
          <span class="item-icon">🥤</span>
          <span class="item-count" id="itemCountProtein">0</span>
        </button>
        <button class="item-slot" id="btnItemOnemore" type="button">
          <span class="item-icon">🧑‍🏫</span>
          <span class="item-count" id="itemCountOnemore">0</span>
        </button>
      </aside>
    </div>
  </section>

  <!-- ============================ CLEAR ============================ -->
  <section class="screen screen--clear" id="screenClear" hidden>
    <h2>CLEAR!</h2>
    <div class="character-sprite big" id="clearSprite">😆</div>
    <p class="result-line" id="clearScore">SCORE 0</p>
    <p class="result-detail" id="clearMaxCombo">MAX COMBO 0</p>
    <p class="result-detail" id="clearTimeBonus">TIME BONUS +0</p>
    <p class="result-sub" id="clearMuscle">마른 몸 (LV.1)</p>
    <button class="btn" id="btnClearRestart" type="button">다시 하기</button>
  </section>

  <!-- ============================ GAME OVER ============================ -->
  <section class="screen screen--gameover" id="screenGameOver" hidden>
    <h2>GAME OVER</h2>
    <div class="character-sprite big" id="gameOverSprite">💤</div>
    <p class="result-line" id="gameOverScore">SCORE 0</p>
    <button class="btn" id="btnGameOverRestart" type="button">다시 하기</button>
  </section>

</div>

<script>
(function(){
  'use strict';

  /* ================================================================
     CONFIG — every tunable number lives here, nothing inline. Every
     section below is live and read by real game logic (this was
     filled in phase by phase from PHASE 2 through PHASE 12).
     ================================================================ */
  const CONFIG = {
    TIMER: {
      INITIAL_TIME: 120,
      WRONG_ANSWER_PENALTY: 5,
      WARNING_AT: 20,              // 이 값 이하면 HUD 경고 표시
      CRITICAL_AT: 10              // 이 값 이하면 더 강한 경고(깜빡임)
    },
    COMBO: {
      HYPE_THRESHOLD: 5,           // PHASE 8 — 이 콤보 이상이면 EXERCISE_HYPE
      MAX: 999                     // 콤보 상한(안전장치)
    },
    SCORE: {
      BASE_CELL_SCORE: 100,        // 정답 1회 기본 점수
      COMBO_BONUS_PER_COMBO: 25,   // 정답 시점의 콤보 × 이 값만큼 추가
      WRONG_ANSWER_PENALTY: 50,
      TIME_BONUS_PER_SECOND: 10,   // CLEAR 시 남은 시간 × 이 값, 1회만 적용
      ITEM_USAGE_PENALTY: 25,
      MIN_SCORE: 0                 // 점수는 이 아래로 내려가지 않음
    },
    EXERCISE: {
      DURATION_MS: 600             // PHASE 8 — 정답 시 운동 포즈 유지 시간
    },
    MISTAKE: {
      DURATION_MS: 700             // PHASE 9 — 오답 시 MISTAKE 연출 유지 시간
    },
    MUSCLE: {
      LEVELS: [                    // score >= minScore, highest match wins — keep sorted ascending
        { level:1, minScore:0,    label:'아주 마른 상태' },
        { level:2, minScore:1000, label:'조금 운동한 상태' },
        { level:3, minScore:2000, label:'탄탄한 상태' },
        { level:4, minScore:3000, label:'근육질' },
        { level:5, minScore:4000, label:'엄청난 근육질' }
      ]
    },
    ITEMS: {
      dumbbell: { count:3, label:'덤벨' },
      protein:  { count:2, label:'프로틴 쉐이크' },
      onemore:  { count:1, label:'PT쌤의 One More!' },
      PROTEIN_RADIUS: 1            // PHASE 10 — 중심 포함 반경 1 = 3×3
    },
    CUTSCENE: {
      AUTO_ADVANCE_MS: 1300,        // 5 slides × 1.3s ≈ 6.5s 총 재생시간 (목표 4~7s)
      SLIDES: [
        { figure:'🧍', text:'주인공은... 매우 말랐다.' },
        { figure:'😤', text:'이대로는 안 되겠다. 오늘부터 운동이다!' },
        { figure:'👀', text:'어? 저기 덤벨이 있다!' },
        { figure:'🙌', text:'좋아, 저 덤벨을 잡아보자...' },
        { figure:'💪', text:'자, 시작해보자!' }
      ]
    }
  };

  /* ================================================================
     EVENT BUS — tiny pub/sub so PuzzleManager can announce results
     without ever calling UI/CharacterManager itself (spec §6). Future
     ComboManager/ScoreManager/etc. subscribe the same way; none of
     them exist yet, so today's only subscriber is GameManager's
     PUZZLE_COMPLETE -> CLEAR wiring, set up in BOOT below.
     ================================================================ */
  const EventBus = {
    handlers: {},
    on(type, fn){
      (this.handlers[type] || (this.handlers[type] = [])).push(fn);
    },
    emit(type, payload){
      (this.handlers[type] || []).forEach(fn => fn(payload));
    }
  };

  /* ================================================================
     TIMER MANAGER — the countdown clock. Only ever emits; never
     touches UIManager or GameManager directly (spec §16). A tick,
     addTime, subtractTime and setTime all funnel through applyTime so
     the "reached zero -> stop + TIME_UP" rule can't be skipped by any
     of them.
     ================================================================ */
  const TimerManager = {
    timeLeft: CONFIG.TIMER.INITIAL_TIME,
    intervalId: null,

    applyTime(newTime){
      this.timeLeft = Math.max(0, newTime);
      EventBus.emit('TIME_UPDATED', { timeLeft:this.timeLeft });
      if(this.timeLeft <= 0){
        this.pause();
        EventBus.emit('TIME_UP', {});
      }
    },

    reset(){
      this.pause();
      this.applyTime(CONFIG.TIMER.INITIAL_TIME);
    },

    // Pausing first guarantees only one interval is ever running, no
    // matter how many times (or from where) start() gets called —
    // START, then RESTART, then another RESTART never stack up.
    start(){
      this.pause();
      if(this.timeLeft > 0){
        this.intervalId = setInterval(() => this.applyTime(this.timeLeft - 1), 1000);
      }
    },

    pause(){
      if(this.intervalId !== null){
        clearInterval(this.intervalId);
        this.intervalId = null;
      }
    },

    resume(){ this.start(); },
    stop(){ this.pause(); },

    addTime(amount){ this.applyTime(this.timeLeft + amount); },
    subtractTime(amount){ this.applyTime(this.timeLeft - amount); },
    setTime(seconds){ this.applyTime(seconds); },

    getTimeLeft(){ return this.timeLeft; }
  };

  /* ================================================================
     COMBO MANAGER — consecutive-correct streak. Only ever emits
     COMBO_CHANGED; never touches UIManager/CharacterManager directly.
     ================================================================ */
  const ComboManager = {
    current: 0,
    max: 0,

    reset(){
      this.current = 0;
      this.max = 0;
      EventBus.emit('COMBO_CHANGED', { currentCombo:this.current, maxCombo:this.max });
    },

    add(){
      this.current = Math.min(this.current + 1, CONFIG.COMBO.MAX);
      if(this.current > this.max) this.max = this.current;
      EventBus.emit('COMBO_CHANGED', { currentCombo:this.current, maxCombo:this.max });
    },

    break(){
      this.current = 0;
      EventBus.emit('COMBO_CHANGED', { currentCombo:this.current, maxCombo:this.max });
    },

    getCurrent(){ return this.current; },
    getMax(){ return this.max; }
  };

  /* ================================================================
     SCORE MANAGER — never goes below CONFIG.SCORE.MIN_SCORE. Every
     change funnels through addScore() so the clamp and the
     SCORE_CHANGED emit can't be skipped by any caller (mirrors
     TimerManager's applyTime pattern). Never touches UIManager.
     ================================================================ */
  const ScoreManager = {
    score: 0,

    reset(){
      this.score = 0;
      EventBus.emit('SCORE_CHANGED', { score:this.score, delta:0, reason:'RESET' });
    },

    addScore(amount, reason){
      const before = this.score;
      this.score = Math.max(CONFIG.SCORE.MIN_SCORE, this.score + amount);
      EventBus.emit('SCORE_CHANGED', { score:this.score, delta:this.score - before, reason });
    },

    subtractScore(amount, reason){
      this.addScore(-amount, reason);
    },

    setScore(value){
      const before = this.score;
      this.score = Math.max(CONFIG.SCORE.MIN_SCORE, value);
      EventBus.emit('SCORE_CHANGED', { score:this.score, delta:this.score - before, reason:'DEBUG_SET' });
    },

    // Only ever called once, at CLEAR (spec §2-4) — GameManager passes
    // in the remaining time so ScoreManager never has to reach into
    // TimerManager itself.
    applyTimeBonus(remainingTime){
      this.addScore(remainingTime * CONFIG.SCORE.TIME_BONUS_PER_SECOND, 'TIME_BONUS');
    },

    applyItemPenalty(){
      this.subtractScore(CONFIG.SCORE.ITEM_USAGE_PENALTY, 'ITEM_USAGE');
    },

    getScore(){ return this.score; },
    getFinalScore(){ return this.score; }
  };

  /* ================================================================
     MUSCLE MANAGER — a pure score -> level lookup, no state of its
     own (spec PHASE 12 §2-4: same score always yields the same
     level). Nothing to reset, so RESTART can't leave a stale level
     behind even without calling reset() — it's kept only to match
     the requested API shape.
     ================================================================ */
  const MuscleManager = {
    getLevelForScore(score){
      const levels = CONFIG.MUSCLE.LEVELS;
      let matched = levels[0];
      for(const l of levels){
        if(score >= l.minScore) matched = l;
      }
      return matched;
    },
    getCurrentMuscleData(){
      return this.getLevelForScore(ScoreManager.getScore());
    },
    getLevel(){
      return this.getCurrentMuscleData().level;
    },
    reset(){ /* stateless — see comment above */ }
  };

  /* ================================================================
     SAMPLE PUZZLE DATA — solution grids only. Hints are always
     derived from `solution` (spec §4), never authored by hand.
     0 = empty, 1 = filled. First entry is the default puzzle.

  /* ================================================================
     PUZZLE SOLVER — pure functions: line hints from a solution grid,
     and a backtracking line-solver used to prove a puzzle's solution
     is unique. No dependency on PuzzleManager or the DOM, so this can
     be (and was) verified standalone under plain Node before wiring
     it up here.
     ================================================================ */
  function computeLineHints(line){
    const hints = [];
    let run = 0;
    for(const v of line){
      if(v === 1){ run++; }
      else if(run > 0){ hints.push(run); run = 0; }
    }
    if(run > 0) hints.push(run);
    return hints.length ? hints : [0];
  }

  function getColumns(grid){
    const n = grid.length;
    const cols = [];
    for(let c=0;c<n;c++) cols.push(grid.map(row => row[c]));
    return cols;
  }

  // All length-`length` 0/1 arrays whose run-lengths match `hints`.
  function generateLinePatterns(hints, length){
    if(hints.length === 1 && hints[0] === 0) return [ new Array(length).fill(0) ];
    const results = [];
    const k = hints.length;
    function place(blockIndex, pos, current){
      if(blockIndex === k){
        const pattern = current.slice();
        for(let i=pos;i<length;i++) pattern[i] = 0;
        results.push(pattern);
        return;
      }
      const blockLen = hints[blockIndex];
      let remaining = 0;
      for(let i=blockIndex+1;i<k;i++) remaining += hints[i] + 1;
      const maxStart = length - remaining - blockLen;
      for(let start=pos; start<=maxStart; start++){
        const next = current.slice();
        for(let i=pos;i<start;i++) next[i] = 0;
        for(let i=start;i<start+blockLen;i++) next[i] = 1;
        let afterPos = start + blockLen;
        if(blockIndex < k-1){ next[afterPos] = 0; afterPos += 1; }
        place(blockIndex+1, afterPos, next);
      }
    }
    place(0, 0, new Array(length).fill(0));
    return results;
  }

  // Row-by-row backtracking, pruned by checking every column's partial
  // fill against its own candidate patterns — stops as soon as `limit`
  // full solutions are found so a uniqueness check never has to
  // enumerate the whole search space.
  function solvePuzzleGrids(rowHints, colHints, size, limit){
    const rowPatterns = rowHints.map(h => generateLinePatterns(h, size));
    const colPatterns = colHints.map(h => generateLinePatterns(h, size));
    const solutions = [];
    const grid = [];

    function colPrefixFeasible(col, r){
      for(const pattern of colPatterns[col]){
        let ok = true;
        for(let i=0;i<=r;i++){ if(pattern[i] !== grid[i][col]){ ok = false; break; } }
        if(ok) return true;
      }
      return false;
    }

    function dfs(row){
      if(solutions.length >= limit) return;
      if(row === size){ solutions.push(grid.map(r => r.slice())); return; }
      for(const pattern of rowPatterns[row]){
        grid[row] = pattern;
        let ok = true;
        for(let c=0;c<size;c++){
          if(!colPrefixFeasible(c, row)){ ok = false; break; }
        }
        if(ok) dfs(row+1);
        if(solutions.length >= limit) return;
      }
      grid[row] = undefined;
    }

    dfs(0);
    return solutions;
  }

  function solvePuzzle(puzzle, limit=2){
    const rowHints = puzzle.solution.map(computeLineHints);
    const colHints = getColumns(puzzle.solution).map(computeLineHints);
    const solutions = solvePuzzleGrids(rowHints, colHints, puzzle.size, limit);
    return {
      solutionCount: solutions.length,
      isUnique: solutions.length === 1,
      solution: solutions[0] || null
    };
  }

  function hasUniqueSolution(puzzle){
    return solvePuzzle(puzzle, 2).isUnique;
  }

  // Checks structure (size/shape/0-1 cells) and that the hints derived
  // from `solution` are internally consistent. Never fails silently —
  // always logs the specific problems found.
  function validatePuzzle(puzzle){
    const errors = [];
    const n = puzzle && puzzle.size;
    if(!puzzle || !Array.isArray(puzzle.solution) || puzzle.solution.length !== n){
      errors.push('solution row count must equal size (' + n + ')');
    } else {
      puzzle.solution.forEach((row, r) => {
        if(!Array.isArray(row) || row.length !== n){
          errors.push('row ' + r + ' length must equal size (' + n + ')');
        }
        (row || []).forEach((v, c) => {
          if(v !== 0 && v !== 1) errors.push('cell [' + r + '][' + c + '] must be 0 or 1, got ' + v);
        });
      });
    }
    if(errors.length){
      console.error('[validatePuzzle] "' + (puzzle && puzzle.id) + '":', errors);
      return { valid:false, errors };
    }

    const rowHints = puzzle.solution.map(computeLineHints);
    const colHints = getColumns(puzzle.solution).map(computeLineHints);
    [...rowHints, ...colHints].forEach((h, i) => {
      const isEmptyLine = h.length === 1 && h[0] === 0;
      if(!isEmptyLine){
        if(h.some(x => !Number.isInteger(x) || x <= 0)) errors.push('hint set ' + i + ' has a non-positive value: ' + h);
        const need = h.reduce((a,b) => a+b, 0) + (h.length - 1);
        if(need > n) errors.push('hint set ' + i + ' (' + h + ') cannot fit in length ' + n);
      }
    });

    if(errors.length) console.error('[validatePuzzle] "' + puzzle.id + '":', errors);
    return { valid: errors.length === 0, errors, rowHints, colHints };
  }

  /* ================================================================
     PUZZLE MANAGER — puzzle data, player grid state, judging. No DOM
     access here at all; PuzzleRenderer (further below) is the only
     thing that reads this object to draw the screen (spec §2/§12).
     ================================================================ */
  const CELL = { UNKNOWN:'UNKNOWN', FILLED:'FILLED', MARKED_EMPTY:'MARKED_EMPTY' };

  const PuzzleManager = {
    puzzle: null,
    playerGrid: null,
    revealGrid: null, // PHASE 10 — item-revealed cells, kept fully separate from playerGrid/solution
    rowHints: null,
    colHints: null,

    load(puzzle){
      const check = validatePuzzle(puzzle);
      if(!check.valid){
        console.error('[PuzzleManager] refused to load invalid puzzle "' + puzzle.id + '"');
        return false;
      }
      if(!hasUniqueSolution(puzzle)){
        console.error('[PuzzleManager] puzzle "' + puzzle.id + '" does not have a unique solution');
      }
      this.puzzle = puzzle;
      this.rowHints = check.rowHints;
      this.colHints = check.colHints;
      this.resetGrid();
      return true;
    },

    resetGrid(){
      const n = this.puzzle.size;
      this.playerGrid = Array.from({ length:n }, () => new Array(n).fill(CELL.UNKNOWN));
      this.revealGrid = Array.from({ length:n }, () => new Array(n).fill(false));
    },

    reset(){
      this.resetGrid();
    },

    // Judgement result; `correct` is null for a plain "back to UNKNOWN"
    // since undoing a guess isn't itself right or wrong.
    setCell(row, col, nextState){
      const n = this.puzzle.size;
      if(row < 0 || row >= n || col < 0 || col >= n) return null;
      this.playerGrid[row][col] = nextState;
      const expected = this.puzzle.solution[row][col];
      let correct = null;
      if(nextState === CELL.FILLED) correct = expected === 1;
      else if(nextState === CELL.MARKED_EMPTY) correct = expected === 0;
      return { correct, row, col, expected, actual:nextState };
    },

    // solution is never touched by a reveal — only revealGrid records
    // that PT쌤 already told the player this cell's answer (spec §10
    // 5-7). A revealed cell counts as done regardless of playerGrid,
    // so the player never has to re-enter what was already revealed.
    revealCell(row, col){
      const n = this.puzzle.size;
      if(row < 0 || row >= n || col < 0 || col >= n) return null;
      this.revealGrid[row][col] = true;
      return { row, col, expected:this.puzzle.solution[row][col] };
    },

    isCellSatisfied(row, col){
      if(this.revealGrid[row][col]) return true;
      const shouldFill = this.puzzle.solution[row][col] === 1;
      const isFilled = this.playerGrid[row][col] === CELL.FILLED;
      return shouldFill === isFilled;
    },

    isComplete(){
      const n = this.puzzle.size;
      for(let r=0;r<n;r++){
        for(let c=0;c<n;c++){
          if(!this.isCellSatisfied(r, c)) return false;
        }
      }
      return true;
    },

    // The real gameplay entry point (PHASE 4): sets the cell like
    // setCell(), then announces the outcome over EventBus instead of
    // calling UI/CharacterManager directly, so Combo/Score/Character
    // can subscribe without PuzzleManager knowing they exist. `source`
    // tags every emitted result as player-driven; ItemManager (PHASE
    // 10) never calls this method at all — it reveals cells through
    // the separate revealCell()/revealGrid below, which is what keeps
    // an item reveal from ever being mistaken for a player guess.
    applyPlayerInput(row, col, nextState, source='PLAYER'){
      const result = this.setCell(row, col, nextState);
      if(!result) return null;
      EventBus.emit('PUZZLE_CELL_RESULT', { ...result, source });
      if(this.isComplete()) EventBus.emit('PUZZLE_COMPLETE', { puzzleId:this.puzzle.id });
      return result;
    }
  };

  /* ================================================================
     ITEM MANAGER — counts + the select-then-target-a-cell flow (spec
     §10 5-3). Reveals go through PuzzleManager.revealCell(), never
     playerGrid, so an item use is never mistaken for player input:
     no PUZZLE_CELL_RESULT is emitted, so Timer/Combo/ExerciseManager/
     MistakeManager — all of which only ever listen for that one event
     — are structurally untouched by an item. The score penalty is
     still wired through EventBus (ITEM_USED -> ScoreManager, in BOOT)
     rather than called directly, same as everywhere else in this file.
     ================================================================ */
  const ITEM_DATA = {
    dumbbell: { label:'덤벨' },
    protein:  { label:'프로틴 쉐이크' },
    onemore:  { label:'PT쌤의 One More!' }
  };

  const ItemManager = {
    counts: {},
    selected: null,

    reset(){
      this.counts = {
        dumbbell: CONFIG.ITEMS.dumbbell.count,
        protein:  CONFIG.ITEMS.protein.count,
        onemore:  CONFIG.ITEMS.onemore.count
      };
      this.selected = null;
      EventBus.emit('ITEM_COUNT_CHANGED', { counts:{ ...this.counts } });
    },

    getCount(type){ return this.counts[type] || 0; },

    select(type){
      if(!GameManager.inputAllowed() || this.getCount(type) <= 0) return false;
      this.selected = type;
      EventBus.emit('ITEM_SELECTED', { type });
      return true;
    },

    cancel(){
      if(!this.selected) return;
      const type = this.selected;
      this.selected = null;
      EventBus.emit('ITEM_CANCELLED', { type });
    },

    targetCells(type, row, col){
      const n = PuzzleManager.puzzle.size;
      const cells = [];
      if(type === 'dumbbell'){
        for(let c=0;c<n;c++) cells.push([row, c]);
        for(let r=0;r<n;r++) if(r !== row) cells.push([r, col]);
      } else if(type === 'protein'){
        const radius = CONFIG.ITEMS.PROTEIN_RADIUS;
        for(let r=row-radius;r<=row+radius;r++){
          for(let c=col-radius;c<=col+radius;c++){
            if(r >= 0 && r < n && c >= 0 && c < n) cells.push([r, c]);
          }
        }
      } else {
        cells.push([row, col]);
      }
      return cells;
    },

    // The player tapped a puzzle cell while an item was selected.
    useAt(row, col){
      if(!this.selected || !GameManager.inputAllowed()) return null;
      const type = this.selected;
      if(this.getCount(type) <= 0) return null;

      const cells = this.targetCells(type, row, col);
      const revealed = cells.map(([r, c]) => PuzzleManager.revealCell(r, c));

      this.counts[type] -= 1;
      this.selected = null;

      EventBus.emit('ITEM_USED', { type, targetRow:row, targetCol:col, affectedCells:cells });
      EventBus.emit('ITEM_REVEALED', { type, cells:revealed });
      EventBus.emit('ITEM_COUNT_CHANGED', { counts:{ ...this.counts } });

      if(PuzzleManager.isComplete()) EventBus.emit('PUZZLE_COMPLETE', { puzzleId:PuzzleManager.puzzle.id });

      return { type, cells:revealed };
    }
  };

  const $ = id => document.getElementById(id);

  /* ================================================================
     DOM REFS
     ================================================================ */
  const screens = {
    TITLE:     $('screenTitle'),
    CUTSCENE:  $('screenCutscene'),
    PLAYING:   $('screenPlaying'),
    CLEAR:     $('screenClear'),
    GAME_OVER: $('screenGameOver')
  };

  const elMuscleLevel     = $('statMuscleLevel');
  const elTime            = $('statTime');
  const elCombo           = $('statCombo');
  const elScore           = $('statScore');
  const elCutsceneFigure  = $('cutsceneFigure');
  const elCutsceneText    = $('cutsceneText');
  const elCharacterSprite = $('characterSprite');
  const elCharacterState  = $('characterState');
  const elDumbbellDrop    = $('dumbbellDrop');
  const elClearSprite     = $('clearSprite');
  const elGameOverSprite  = $('gameOverSprite');
  const elClearScore      = $('clearScore');
  const elClearMaxCombo   = $('clearMaxCombo');
  const elClearTimeBonus  = $('clearTimeBonus');
  const elClearMuscle     = $('clearMuscle');
  const elGameOverScore   = $('gameOverScore');
  const elNonogramGrid    = $('nonogramGrid');
  const elModeFillBtn     = $('btnModeFill');
  const elModeMarkBtn     = $('btnModeMark');
  const elItemTargetBanner= $('itemTargetBanner');
  const elItemButtons     = {
    dumbbell: $('btnItemDumbbell'),
    protein:  $('btnItemProtein'),
    onemore:  $('btnItemOnemore')
  };

  /* ================================================================
     GAME MANAGER — top-level state machine.
     TITLE -> CUTSCENE -> PLAYING -> CLEAR | GAME_OVER
     Each state gates which screen is visible and whether puzzle
     input is allowed (only PLAYING permits it, per spec §16).
     ================================================================ */
  const GameManager = {
    state: 'TITLE',
    inputAllowed(){
      return this.state === 'PLAYING';
    },
    setState(next){
      this.state = next;
      for(const key in screens) screens[key].hidden = key !== next;

      if(next === 'CUTSCENE') Cutscene.start();
      if(next === 'PLAYING'){
        CharacterManager.setState('IDLE');
        TimerManager.start();
      }
      if(next === 'CLEAR'){
        CharacterManager.setState('CLEAR');
        TimerManager.stop();
        ScoreManager.applyTimeBonus(TimerManager.getTimeLeft()); // §2-4: once, here only — never on GAME_OVER
        ItemManager.cancel(); // §10 5-13: any pending item selection is cancelled immediately
        UIManager.syncClearResult();
      }
      if(next === 'GAME_OVER'){
        CharacterManager.setState('GAME_OVER');
        TimerManager.stop();
        ItemManager.cancel();
      }

      UIManager.syncAll();
    }
  };

  /* ================================================================
     CHARACTER MANAGER — character state machine.
     IDLE / EXERCISE / EXERCISE_HYPE / MISTAKE / CLEAR / GAME_OVER
     Visuals are emoji placeholders for now (spec §18) — swapping in
     real sprites later only means editing CHARACTER_SPRITES/
     EXERCISE_DATA below. EXERCISE/EXERCISE_HYPE don't have a fixed
     sprite here — they show whichever exercise is currently active
     (spec §8-3-2), set via setExercise() by ExerciseManager.
     ================================================================ */
  const CHARACTER_SPRITES = {
    IDLE: '🧍',
    MISTAKE: '😵',
    CLEAR: '😆',
    GAME_OVER: '💤'
  };

  const EXERCISE_DATA = {
    BICEP_CURL:     { label:'이두컬',          icon:'💪',  hypeIcon:'💪🔥' },
    SQUAT:          { label:'스쿼트',          icon:'🦵',  hypeIcon:'🦵🔥' },
    OVERHEAD_PRESS: { label:'오버헤드 프레스', icon:'🏋️', hypeIcon:'🏋️🔥' }
  };

  // CLEAR poses by last-used exercise (spec PHASE 11 §1-2): bicep-focused,
  // lower-body-focused, shoulder-focused.
  const CLEAR_POSES = {
    BICEP_CURL: '💪😆',
    SQUAT: '🦵😆',
    OVERHEAD_PRESS: '🙌😆'
  };

  const CharacterManager = {
    state: 'IDLE',
    exercise: null, // set by ExerciseManager from the active puzzle's `exercise` field; persists through CLEAR/GAME_OVER so a pose can still use it

    setExercise(type){
      this.exercise = type;
    },

    // Restarts a CSS animation on `el` by toggling `cls` off/reflow/on.
    replay(el, cls){
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    },

    setState(next){
      this.state = next;
      const isExercise = next === 'EXERCISE' || next === 'EXERCISE_HYPE';
      const ex = EXERCISE_DATA[this.exercise];

      elCharacterSprite.textContent = isExercise
        ? (ex ? (next === 'EXERCISE_HYPE' ? ex.hypeIcon : ex.icon) : CHARACTER_SPRITES.IDLE)
        : (CHARACTER_SPRITES[next] || CHARACTER_SPRITES.IDLE);
      elCharacterState.textContent = isExercise ? (ex ? ex.label : next) : next;

      elCharacterSprite.classList.remove('pop', 'hype', 'game-over-fall', 'mistake-shake');
      elDumbbellDrop.classList.remove('falling');
      void elCharacterSprite.offsetWidth; // restart the CSS animation

      if(next === 'GAME_OVER'){
        elCharacterSprite.classList.add('game-over-fall');
        // screenPlaying is hidden the instant GameManager entered this
        // state, so the fall has to actually play on the RESULT
        // screen's own sprite — the one further above never gets
        // painted while GAME_OVER is showing.
        elGameOverSprite.textContent = CHARACTER_SPRITES.GAME_OVER;
        this.replay(elGameOverSprite, 'game-over-fall');
      } else if(next === 'MISTAKE'){
        elCharacterSprite.classList.add('mistake-shake');
        this.replay(elDumbbellDrop, 'falling');
      } else if(next === 'CLEAR'){
        elCharacterSprite.classList.add('pop');
        // Same reasoning as GAME_OVER above — pose on the visible
        // #clearSprite, not the hidden PLAYING-screen sprite.
        elClearSprite.textContent = (ex && CLEAR_POSES[this.exercise]) || CHARACTER_SPRITES.CLEAR;
        this.replay(elClearSprite, 'pop');
      } else {
        elCharacterSprite.classList.add('pop');
        if(next === 'EXERCISE_HYPE') elCharacterSprite.classList.add('hype');
      }
    }
  };

  /* ================================================================
     EXERCISE MANAGER — plays a brief EXERCISE/EXERCISE_HYPE pose on
     every correct answer, then returns to IDLE on its own. Registered
     on PUZZLE_CELL_RESULT after ComboManager (spec §8-4) so the hype
     check already sees this same answer's post-add() combo. Never
     touches TimerManager/ComboManager/ScoreManager itself.
     ================================================================ */
  const ExerciseManager = {
    returnTimer: null,

    trigger(){
      if(!PuzzleManager.puzzle) return;
      clearTimeout(MistakeManager.returnTimer); // a fresh correct answer supersedes a lingering mistake pose
      CharacterManager.setExercise(PuzzleManager.puzzle.exercise);
      const hype = ComboManager.getCurrent() >= CONFIG.COMBO.HYPE_THRESHOLD;
      CharacterManager.setState(hype ? 'EXERCISE_HYPE' : 'EXERCISE');
      EventBus.emit('EXERCISE_STARTED', { exercise:PuzzleManager.puzzle.exercise, combo:ComboManager.getCurrent(), hype });

      clearTimeout(this.returnTimer);
      this.returnTimer = setTimeout(() => {
        // Guards against clobbering a CLEAR/GAME_OVER/MISTAKE pose that
        // happened to land while this timer was still pending.
        if(CharacterManager.state === 'EXERCISE' || CharacterManager.state === 'EXERCISE_HYPE'){
          CharacterManager.setState('IDLE');
          EventBus.emit('EXERCISE_ENDED', { exercise:PuzzleManager.puzzle.exercise });
        }
      }, CONFIG.EXERCISE.DURATION_MS);
    }
  };

  /* ================================================================
     MISTAKE MANAGER — plays the "dropped the dumbbell" MISTAKE pose
     on every wrong answer, then returns to IDLE. Same timed-revert
     shape as ExerciseManager, and the two cancel each other's pending
     timer so a rapid correct-then-wrong (or vice versa) can't leave a
     stale timeout to flip the pose back at the wrong moment.
     ================================================================ */
  const MistakeManager = {
    returnTimer: null,

    trigger(){
      // A wrong answer that also empties the clock already moved
      // GameManager to GAME_OVER earlier in this same PUZZLE_CELL_RESULT
      // chain (TimerManager's handler runs before this one and can emit
      // TIME_UP synchronously) — don't stomp that pose with MISTAKE.
      // Found by PHASE 15 integration testing: a wrong click landing
      // exactly on the last second used to show MISTAKE instead of the
      // fallen GAME_OVER pose.
      if(!GameManager.inputAllowed()) return;
      clearTimeout(ExerciseManager.returnTimer);
      CharacterManager.setState('MISTAKE');

      clearTimeout(this.returnTimer);
      this.returnTimer = setTimeout(() => {
        if(CharacterManager.state === 'MISTAKE') CharacterManager.setState('IDLE');
      }, CONFIG.MISTAKE.DURATION_MS);
    }
  };

  /* ================================================================
     UI MANAGER — HUD + result-screen text sync. Owns none of the
     actual game state — score/time/combo all live in their own
     managers and reach the HUD only through EventBus subscriptions
     set up in BOOT, so no manager ever has to call into UIManager.
     ================================================================ */
  function formatTime(totalSeconds){
    const m = Math.floor(totalSeconds / 60);
    const s = Math.floor(totalSeconds % 60);
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  const UIManager = {
    prevCombo: 0,

    syncAll(){
      this.syncScore(ScoreManager.getScore(), 0);
      this.syncTime(TimerManager.getTimeLeft());
      this.syncCombo(ComboManager.getCurrent());
    },

    syncScore(score, delta){
      const ml = MuscleManager.getLevelForScore(score);
      elMuscleLevel.textContent = 'LV.' + ml.level;
      elScore.textContent = score;
      elClearScore.textContent = 'SCORE ' + score;
      elClearMuscle.textContent = ml.label + ' (LV.' + ml.level + ')';
      elGameOverScore.textContent = 'SCORE ' + score;
      if(delta){
        const popup = document.createElement('span');
        popup.className = 'score-popup ' + (delta > 0 ? 'positive' : 'negative');
        popup.textContent = (delta > 0 ? '+' : '') + delta;
        popup.addEventListener('animationend', () => popup.remove());
        elScore.parentElement.appendChild(popup);
      }
    },

    syncTime(timeLeft){
      elTime.textContent = formatTime(timeLeft);
      elTime.classList.toggle('critical', timeLeft <= CONFIG.TIMER.CRITICAL_AT);
      elTime.classList.toggle('warning', timeLeft > CONFIG.TIMER.CRITICAL_AT && timeLeft <= CONFIG.TIMER.WARNING_AT);
    },

    syncCombo(current){
      elCombo.textContent = current;
      if(current > this.prevCombo){
        elCombo.classList.remove('combo-pop');
        void elCombo.offsetWidth;
        elCombo.classList.add('combo-pop');
      }
      this.prevCombo = current;
    },

    // PHASE 11 — the extra CLEAR-only result lines. TimerManager.stop()
    // never zeroes timeLeft, so re-deriving the bonus here (same
    // formula ScoreManager already applied once) needs no data passed
    // in from GameManager.
    syncClearResult(){
      elClearMaxCombo.textContent = 'MAX COMBO ' + ComboManager.getMax();
      elClearTimeBonus.textContent = 'TIME BONUS +' + (TimerManager.getTimeLeft() * CONFIG.SCORE.TIME_BONUS_PER_SECOND);
      // PHASE 12 — a visible size/glow bump on the result sprite so a
      // higher muscle level reads as "bigger," not just a number.
      const level = MuscleManager.getLevel();
      for(let i=1;i<=5;i++) elClearSprite.classList.remove('muscle-lv-' + i);
      elClearSprite.classList.add('muscle-lv-' + level);
    }
  };

  /* ================================================================
     PUZZLE RENDERING — reads PuzzleManager state and draws the grid.
     Pure UI concern: no judging happens here, and nothing here
     mutates PuzzleManager (spec §2/§6). Cells carry data-row/data-col,
     which is what let PHASE 4's input layer (further below) wire
     click/touch without touching this rendering code at all.
     ================================================================ */
  const CELL_GLYPH = { UNKNOWN:'', FILLED:'', MARKED_EMPTY:'✕' };

  const PuzzleRenderer = {
    // A revealed cell (spec §10 5-8) shows the real answer regardless
    // of playerGrid, with a distinct ring so it reads as "the game
    // told me this," not "I filled this in."
    cellClass(row, col){
      const revealed = PuzzleManager.revealGrid[row][col];
      const filled = revealed
        ? PuzzleManager.puzzle.solution[row][col] === 1
        : PuzzleManager.playerGrid[row][col] === CELL.FILLED;
      return 'ng-cell' + (filled ? ' filled' : '') + (revealed ? ' revealed' : '');
    },

    cellGlyph(row, col){
      if(PuzzleManager.revealGrid[row][col]){
        return PuzzleManager.puzzle.solution[row][col] === 1 ? '' : '✕';
      }
      return CELL_GLYPH[PuzzleManager.playerGrid[row][col]];
    },

    renderAll(){
      const { puzzle, rowHints, colHints } = PuzzleManager;
      const n = puzzle.size;

      elNonogramGrid.style.gridTemplateColumns = 'auto repeat(' + n + ', 1fr)';
      elNonogramGrid.style.gridTemplateRows = 'auto repeat(' + n + ', 1fr)';

      let html = '<div class="ng-corner"></div>';
      for(let c=0;c<n;c++){
        html += '<div class="ng-colhint">' + colHints[c].map(h => '<span>' + h + '</span>').join('') + '</div>';
      }
      for(let r=0;r<n;r++){
        html += '<div class="ng-rowhint">' + rowHints[r].join(' ') + '</div>';
        for(let c=0;c<n;c++){
          html += '<div class="' + this.cellClass(r,c) + '" data-row="' + r + '" data-col="' + c + '">' + this.cellGlyph(r,c) + '</div>';
        }
      }
      elNonogramGrid.innerHTML = html;
    },

    cellEl(row, col){
      return elNonogramGrid.querySelector('.ng-cell[data-row="' + row + '"][data-col="' + col + '"]');
    },

    // Targeted single-cell update — used on every real player action so
    // a click doesn't rebuild the whole grid (renderAll stays reserved
    // for load/reset/puzzle-switch/multi-cell item reveals).
    renderCell(row, col){
      const el = this.cellEl(row, col);
      if(!el) return;
      el.className = this.cellClass(row, col);
      el.textContent = this.cellGlyph(row, col);
    },

    // Brief, non-blocking correct/wrong feedback (spec §7). Re-adding
    // the class after a forced reflow lets it replay on repeat hits,
    // same trick as CharacterManager's `.pop` restart.
    flashCell(row, col, correct){
      const el = this.cellEl(row, col);
      if(!el) return;
      const cls = correct ? 'flash-correct' : 'flash-wrong';
      el.classList.remove('flash-correct', 'flash-wrong');
      void el.offsetWidth;
      el.classList.add(cls);
    }
  };

  /* ================================================================
     PUZZLE INPUT — translates raw pointer/touch gestures into
     PuzzleManager.applyPlayerInput() calls (spec §2). Left-click/tap
     always uses the active InputMode (FILL/MARK) so touch devices
     without a right-click get full parity; right-click is an extra
     desktop-only shortcut that always marks, regardless of the
     current mode. Blocked outright unless GameManager.inputAllowed().
     ================================================================ */
  const InputMode = {
    current: 'FILL',
    set(mode){
      this.current = mode;
      elModeFillBtn.classList.toggle('active', mode === 'FILL');
      elModeMarkBtn.classList.toggle('active', mode === 'MARK');
    }
  };

  // FILLED/MARKED_EMPTY toggle back to UNKNOWN on a repeat hit (spec
  // §4) so correcting a guess never needs a third input mode.
  function resolveNextState(current, mode){
    if(mode === 'MARK') return current === CELL.MARKED_EMPTY ? CELL.UNKNOWN : CELL.MARKED_EMPTY;
    return current === CELL.FILLED ? CELL.UNKNOWN : CELL.FILLED;
  }

  function handleCellInput(row, col, mode){
    if(!GameManager.inputAllowed()) return null;
    const current = PuzzleManager.playerGrid[row][col];
    const nextState = resolveNextState(current, mode);
    const result = PuzzleManager.applyPlayerInput(row, col, nextState);
    if(!result) return null;
    PuzzleRenderer.renderCell(row, col);
    if(result.correct !== null) PuzzleRenderer.flashCell(row, col, result.correct);
    return result;
  }

  // While an item is selected, a puzzle-cell tap resolves the item's
  // target instead of a normal fill/mark (spec §10 5-3) — full rebuild
  // because dumbbell/protein can reveal many cells in one tap.
  function handleItemTarget(row, col){
    const used = ItemManager.useAt(row, col);
    if(used) PuzzleRenderer.renderAll();
    return used;
  }

  function initPuzzleInput(){
    elNonogramGrid.addEventListener('click', e => {
      const cell = e.target.closest('.ng-cell');
      if(!cell) return;
      const row = Number(cell.dataset.row), col = Number(cell.dataset.col);
      if(ItemManager.selected){ handleItemTarget(row, col); return; }
      handleCellInput(row, col, InputMode.current);
    });
    // Prevented everywhere in the puzzle area, not just on a cell hit —
    // this also covers a touch long-press's contextmenu equivalent.
    elNonogramGrid.addEventListener('contextmenu', e => {
      e.preventDefault();
      const cell = e.target.closest('.ng-cell');
      if(!cell) return;
      const row = Number(cell.dataset.row), col = Number(cell.dataset.col);
      if(ItemManager.selected){ handleItemTarget(row, col); return; }
      handleCellInput(row, col, 'MARK');
    });
    elModeFillBtn.addEventListener('click', () => InputMode.set('FILL'));
    elModeMarkBtn.addEventListener('click', () => InputMode.set('MARK'));

    elItemTargetBanner.addEventListener('click', () => ItemManager.cancel());
    for(const type in elItemButtons){
      elItemButtons[type].addEventListener('click', () => {
        if(ItemManager.selected === type) ItemManager.cancel();
        else ItemManager.select(type);
      });
    }
  }

  /* ================================================================
     CUTSCENE — 5-beat slideshow (spec §3, filled in at PHASE 13).
     Auto-advances every AUTO_ADVANCE_MS, but a click/tap or SKIP jumps
     straight to PLAYING. Still text+emoji only, no transitions/art —
     that would be the next round of visual polish, not required here.
     ================================================================ */
  const Cutscene = {
    idx: 0,
    timer: null,
    start(){
      this.idx = 0;
      this.render();
      this.schedule();
    },
    schedule(){
      clearTimeout(this.timer);
      this.timer = setTimeout(() => this.next(), CONFIG.CUTSCENE.AUTO_ADVANCE_MS);
    },
    render(){
      const slide = CONFIG.CUTSCENE.SLIDES[this.idx];
      elCutsceneFigure.textContent = slide.figure;
      elCutsceneText.textContent = slide.text;
    },
    next(){
      this.idx += 1;
      if(this.idx >= CONFIG.CUTSCENE.SLIDES.length){
        clearTimeout(this.timer);
        GameManager.setState('PLAYING');
        return;
      }
      this.render();
      this.schedule();
    },
    skip(){
      clearTimeout(this.timer);
      GameManager.setState('PLAYING');
    }
  };

  /* ================================================================
     ITEM PANEL — reads ItemManager state and paints counts/disabled/
     selected on the item buttons plus the "pick a target cell"
     banner. Pure UI: never mutates ItemManager (same rule as
     PuzzleRenderer).
     ================================================================ */
  function renderItemPanel(){
    for(const type in elItemButtons){
      const btn = elItemButtons[type];
      const count = ItemManager.getCount(type);
      btn.querySelector('.item-count').textContent = count;
      btn.disabled = count <= 0;
      btn.classList.toggle('selected', ItemManager.selected === type);
    }
    if(ItemManager.selected){
      elItemTargetBanner.hidden = false;
      elItemTargetBanner.textContent = ITEM_DATA[ItemManager.selected].label + ': 대상 칸을 선택하세요 (탭하면 취소)';
    } else {
      elItemTargetBanner.hidden = true;
    }
  }

  /* ================================================================
     BOOT + EVENTS
     ================================================================ */
  function restart(){
    TimerManager.reset();
    ComboManager.reset();
    ScoreManager.reset();
    ItemManager.reset();
    PuzzleManager.load(SAMPLE_PUZZLES[0]);
    PuzzleRenderer.renderAll();
    GameManager.setState('PLAYING'); // starts the timer fresh via GameManager.setState
  }

  $('btnStart').addEventListener('click', () => GameManager.setState('CUTSCENE'));
  $('btnSkipCutscene').addEventListener('click', () => Cutscene.skip());
  $('btnClearRestart').addEventListener('click', restart);
  $('btnGameOverRestart').addEventListener('click', restart);
  $('screenCutscene').addEventListener('click', e => {
    if(e.target.closest('#btnSkipCutscene')) return;
    Cutscene.next();
  });

  // A completed puzzle is the only thing that should move the game to
  // CLEAR right now — connects to the existing CLEAR screen, no new
  // clear presentation is added this phase (spec §9).
  EventBus.on('PUZZLE_COMPLETE', () => {
    if(GameManager.state === 'PLAYING') GameManager.setState('CLEAR');
  });

  // Time running out is the other way PLAYING ends (spec §7/§16):
  // TimerManager only ever announces TIME_UP, GameManager decides
  // what that means.
  EventBus.on('TIME_UP', () => {
    if(GameManager.state === 'PLAYING') GameManager.setState('GAME_OVER');
  });

  // Every cell judgement reaches Timer and Combo through the same
  // PUZZLE_CELL_RESULT event PuzzleManager already emits (PHASE 4) —
  // each fires exactly once per input, so a wrong answer can never
  // double up its time penalty or its combo break (spec §6/§21).
  EventBus.on('PUZZLE_CELL_RESULT', result => {
    if(result.correct === false) TimerManager.subtractTime(CONFIG.TIMER.WRONG_ANSWER_PENALTY);
  });
  EventBus.on('PUZZLE_CELL_RESULT', result => {
    if(result.correct === true) ComboManager.add();
    else if(result.correct === false) ComboManager.break();
    // correct === null (an UNKNOWN undo) leaves the combo untouched.
  });

  // Registered after the ComboManager subscription above so
  // ComboManager.getCurrent() already reflects this same answer's
  // post-add()/break() value (spec §2-2's required ordering) without
  // ScoreManager having to subscribe to COMBO_CHANGED and guess why
  // the combo moved.
  EventBus.on('PUZZLE_CELL_RESULT', result => {
    if(result.correct === true){
      const bonus = CONFIG.SCORE.BASE_CELL_SCORE + ComboManager.getCurrent() * CONFIG.SCORE.COMBO_BONUS_PER_COMBO;
      ScoreManager.addScore(bonus, 'CELL_CORRECT');
    } else if(result.correct === false){
      ScoreManager.subtractScore(CONFIG.SCORE.WRONG_ANSWER_PENALTY, 'WRONG_ANSWER');
    }
  });

  // Correct -> a brief EXERCISE/EXERCISE_HYPE pose (spec §8). Also
  // registered after ComboManager's handler so the hype check reads
  // this answer's already-updated combo.
  EventBus.on('PUZZLE_CELL_RESULT', result => {
    if(result.correct === true) ExerciseManager.trigger();
  });

  // Wrong -> a brief MISTAKE (dumbbell-drop) pose (spec §9). Timer's
  // penalty and ComboManager's break() are already independent
  // subscribers above; this only adds the presentation.
  EventBus.on('PUZZLE_CELL_RESULT', result => {
    if(result.correct === false) MistakeManager.trigger();
  });

  EventBus.on('TIME_UPDATED', ({ timeLeft }) => UIManager.syncTime(timeLeft));
  EventBus.on('COMBO_CHANGED', ({ currentCombo }) => UIManager.syncCombo(currentCombo));
  EventBus.on('SCORE_CHANGED', ({ score, delta }) => UIManager.syncScore(score, delta));

  // Item use never counts as a player guess, so it is deliberately its
  // own event rather than going through PUZZLE_CELL_RESULT — the
  // penalty is the only game-state effect an item use has (spec §10
  // 5-10), applied exactly once per successful use.
  EventBus.on('ITEM_USED', () => ScoreManager.applyItemPenalty());
  EventBus.on('ITEM_COUNT_CHANGED', renderItemPanel);
  EventBus.on('ITEM_SELECTED', renderItemPanel);
  EventBus.on('ITEM_CANCELLED', renderItemPanel);

  initPuzzleInput();
  PuzzleManager.load(SAMPLE_PUZZLES[0]);
  PuzzleRenderer.renderAll();
  ItemManager.reset();
  renderItemPanel();
  GameManager.setState('TITLE');
  UIManager.syncAll();

  /* ================================================================
     DEBUG / TEST HOOK — mirrors the existing project's window.__ES__
     convention. Safe to strip in production; nothing depends on it.
     ================================================================ */
  window.__MML__ = {
    snap: () => ({
      gameState: GameManager.state,
      characterState: CharacterManager.state,
      score: ScoreManager.getScore(),
      combo: ComboManager.getCurrent(),
      maxCombo: ComboManager.getMax(),
      timeLeft: TimerManager.getTimeLeft()
    }),
    forceGameState: s => GameManager.setState(s),
    forceCharacterState: s => CharacterManager.setState(s),
    restart,

    // PHASE 3 — PuzzleManager test surface
    CELL_STATES: CELL,
    getPuzzle: () => PuzzleManager.puzzle,
    getHints: () => ({ rowHints: PuzzleManager.rowHints, colHints: PuzzleManager.colHints }),
    getPlayerGrid: () => PuzzleManager.playerGrid,
    setCell: (row, col, state) => {
      const result = PuzzleManager.setCell(row, col, state);
      PuzzleRenderer.renderAll();
      return result;
    },
    isComplete: () => PuzzleManager.isComplete(),
    resetPuzzle: () => { PuzzleManager.reset(); PuzzleRenderer.renderAll(); },
    loadPuzzle: key => {
      const puzzle = SAMPLE_PUZZLES.find(p => p.id === key) || SAMPLE_PUZZLES[key];
      if(!puzzle) return false;
      const ok = PuzzleManager.load(puzzle);
      if(ok) PuzzleRenderer.renderAll();
      return ok;
    },
    listPuzzles: () => SAMPLE_PUZZLES.map(p => ({ id:p.id, name:p.name, size:p.size })),
    validatePuzzle: puzzle => validatePuzzle(puzzle || PuzzleManager.puzzle),
    solvePuzzle: puzzle => solvePuzzle(puzzle || PuzzleManager.puzzle),

    // PHASE 4 — real input simulation, gated by GameManager just like
    // a genuine click/tap would be (unlike the raw setCell above).
    clickCell: (row, col) => handleCellInput(row, col, InputMode.current),
    rightClickCell: (row, col) => handleCellInput(row, col, 'MARK'),
    getCellResult: (row, col) => {
      const p = PuzzleManager;
      if(!p.puzzle) return null;
      const actual = p.playerGrid[row][col];
      const expected = p.puzzle.solution[row][col];
      let correct = null;
      if(actual === CELL.FILLED) correct = expected === 1;
      else if(actual === CELL.MARKED_EMPTY) correct = expected === 0;
      return { row, col, expected, actual, correct };
    },
    getInputMode: () => InputMode.current,
    setInputMode: mode => InputMode.set(mode),

    // PHASE 5 — TimerManager test surface
    getTime: () => TimerManager.getTimeLeft(),
    setTime: seconds => TimerManager.setTime(seconds),
    startTimer: () => TimerManager.start(),
    pauseTimer: () => TimerManager.pause(),
    stopTimer: () => TimerManager.stop(),
    forceTimeUp: () => TimerManager.setTime(0),

    // PHASE 6 — ComboManager test surface
    getCombo: () => ComboManager.getCurrent(),
    getMaxCombo: () => ComboManager.getMax(),
    resetCombo: () => ComboManager.reset(),

    // PHASE 7 — ScoreManager test surface
    getScore: () => ScoreManager.getScore(),
    setScore: v => ScoreManager.setScore(v),
    resetScore: () => ScoreManager.reset(),

    // PHASE 8 — CharacterManager/ExerciseManager test surface
    getCharacterState: () => CharacterManager.state,
    getCurrentExercise: () => CharacterManager.exercise,
    setExercise: type => CharacterManager.setExercise(type),
    triggerExercise: () => ExerciseManager.trigger(),

    // PHASE 9 — MistakeManager test surface
    triggerMistake: () => MistakeManager.trigger(),

    // PHASE 10 — ItemManager test surface
    getItemCounts: () => ({ ...ItemManager.counts }),
    getSelectedItem: () => ItemManager.selected,
    selectItem: type => ItemManager.select(type),
    cancelItem: () => ItemManager.cancel(),
    // One-shot convenience: selects `type` then immediately uses it at
    // (row,col), for tests that don't need to check the intermediate
    // "selected" state.
    useItem: (type, row, col) => {
      if(!ItemManager.select(type)) return null;
      const result = handleItemTarget(row, col);
      return result;
    },
    getRevealGrid: () => PuzzleManager.revealGrid,
    isCellRevealed: (row, col) => PuzzleManager.revealGrid[row][col],

    // PHASE 12 — MuscleManager test surface
    getMuscleLevel: () => MuscleManager.getCurrentMuscleData(),
    getMuscleLevelForScore: score => MuscleManager.getLevelForScore(score)
  };
})();
</script>
</body>
</html>
